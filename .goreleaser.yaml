# Origin: nodelogicau/intentions-cli .goreleaser.yaml @ b72a395454aa
version: 2

project_name: episodes

before:
  hooks:
    - go mod tidy

builds:
  - id: episodes
    main: ./cmd/episodes
    binary: episodes
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/nodelogicau/episodes-cli/internal/cli.version={{ .Version }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

# Darwin universal binary for the Desktop bundle (MCPB platform overrides are
# keyed by OS, not arch). The per-arch archives are unaffected.
universal_binaries:
  - id: episodes-universal
    ids: [episodes]
    replace: false
    name_template: episodes
    hooks:
      post: sh scripts/build-bundle.sh {{ .Version }} dist

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  extra_files:
    - glob: dist/*.mcpb

# Homebrew cask (macOS and Linux), published to the same tap as particulars
# and intentions. `brews` was removed in GoReleaser 2.16; casks are the
# supported way to ship a pre-built binary.
homebrew_casks:
  - name: episodes
    repository:
      owner: nodelogicau
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/nodelogicau/episodes-cli
    description: Write and check Episodes Format workspaces from the command line
    license: MIT
    skip_upload: auto
    commit_author:
      name: episodes-release
      email: noreply@nodelogic.au
    binaries:
      - episodes
    # The binaries are not signed or notarised. Homebrew deprecated
    # `postflight`, which hooks.post.install generates, for the declarative
    # `postflight_steps`. The block is a Go template, so Homebrew's own
    # {{staged_path}} placeholder is escaped to pass through.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/episodes"]
        end
      end

release:
  extra_files:
    - glob: dist/*.mcpb
